name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v4
        - run: pip install esphome
        - run: esphome compile esp32-pv18.yaml
        - uses: actions/upload-artifact@v4
          with:
            name: must-firmware
            path: **/*.bin
